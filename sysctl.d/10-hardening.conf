 # /etc/sysctl.d/10-hardening.conf
 #
 # Kernel-Härtung und Angriffssicherheits-Optimierungen

 # -------------------------------------------------------------------
 # 1. Kernel-Zeiger und Log-Einschränkungen
 # -------------------------------------------------------------------
 # Verbietet unprivilegierten Benutzern das Auslesen von Kernel-Speicheradressen (kallsyms)
 kernel.kptr_restrict = 2

 # Verhindert, dass unprivilegierte Benutzer dmesg (Kernel-Log) auslesen
 kernel.dmesg_restrict = 1

 # Reduziert Konsolen-Log-Spamming (nur Notfälle/Kritische Meldungen auf TTY)
 kernel.printk = 3 3 3 3

 # -------------------------------------------------------------------
 # 2. eBPF & JIT-Sicherheit
 # -------------------------------------------------------------------
 # Deaktiviert unprivilegiertes eBPF (Schutz vor Local Privilege Escalation & Spectre-Varianten)
 kernel.unprivileged_bpf_disabled = 1

 # Härtet den BPF-JIT-Compiler (Constant Blinding für alle Benutzer)
 net.core.bpf_jit_harden = 2

 # -------------------------------------------------------------------
 # 3. Kernel-Laufzeit & Speicher-Schutz
 # -------------------------------------------------------------------
 # Deaktiviert kexec (Verhindert das Laden eines neuen Kernels im laufenden Betrieb ohne Neustart)
 kernel.kexec_load_disabled = 1

 # Restriktion der Magic SysRq Taste auf sichere Operationen (Sync, Unmount/Read-Only, Reboot)
 kernel.sysrq = 176

 # Vollständige ASLR (Address Space Layout Randomization) aktivieren
 kernel.randomize_va_space = 2

 # Verhindert Core-Dumps von Setuid-Binärdateien (Kein Passwort-Leak im Core-Dump)
 fs.suid_dumpable = 0

 # -------------------------------------------------------------------
 # 4. Dateisystem-Schutzmaßnahmen (Symlinks & Hardlinks)
 # -------------------------------------------------------------------
 # Verhindert Symlink-Angriffe in welt-schreibbaren Ordnern (/tmp)
 fs.protected_symlinks = 1

 # Verhindert Hardlink-Schwachstellen in welt-schreibbaren Ordnern
 fs.protected_hardlinks = 1

 # Schutz vor böswilliger FIFO- und Datei-Erstellung in /tmp
 fs.protected_fifos = 2
 fs.protected_regular = 2
