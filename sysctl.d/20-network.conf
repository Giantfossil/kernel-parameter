# /etc/sysctl.d/20-network.conf
# Netzwerk-Sicherheit, IPv4/IPv6-Härtung und TCP-Performance-Tuning

# -------------------------------------------------------------------
# 1. TCP/IP-Sicherheit & Angriffs-Abwehr
# -------------------------------------------------------------------
# TCP SYN Cookies aktivieren (Schutz vor SYN-Flood-DDoS)
net.ipv4.tcp_syncookies = 1

# Schutz vor TCP TIME-WAIT Assassination (RFC 1337)
net.ipv4.tcp_rfc1337 = 1

# Reverse Path Filtering (Spoofing-Schutz: Pakete verwürfen, deren Quell-IP unplausibel ist)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ICMP-Redirects ignorieren (Schutz vor Man-in-the-Middle Route-Poisoning)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Keine ICMP-Redirects senden (System agiert nicht als Router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Source-Routed Pakete ablehnen
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Broadcast-Ping (ICMP-Echo) ignorieren (Schutz vor Smurf-Attacken)
#net.ipv4.icmp_echo_ignore_broadcasts = 1

# Fehlerhafte ICMP-Fehlermeldungen ignorieren
net.ipv4.icmp_ignore_bogus_error_responses = 1

# IPv6 Privacy Extensions aktivieren (Dynamische temporäre IPv6-Adressen für ausgehende verbindungen)
#net.ipv6.conf.all.use_tempaddr = 2
#net.ipv6.conf.default.use_tempaddr = 2

# -------------------------------------------------------------------
# 2. TCP-Performance & Algorithmen
# -------------------------------------------------------------------
# Fair Queueing als Standard-Qdisc festlegen (Voraussetzung für BBR)
net.core.default_qdisc = fq

# TCP BBR Stauregelung aktivieren (Höherer Durchsatz & geringere Latenz)
net.ipv4.tcp_congestion_control = bbr

# TCP Fast Open für Client und Server aktivieren (spart Roundtrips beim Verbindungsaufbau)
net.ipv4.tcp_fastopen = 3

# Wiederverwendung von TIME_WAIT Sockets für ausgehende Verbindungen erlauben
net.ipv4.tcp_tw_reuse = 1

# FIN-WAIT-2 Sockets-Timeout reduzieren (Standard 60s -> 15s)
net.ipv4.tcp_fin_timeout = 15

# Schnellere Erkennung verwaister TCP-Verbindungen (TCP Keepalive Tuning)
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Path MTU Discovery Troubleshooting (verhindert Paketverluste bei Blackhole-Routern)
net.ipv4.tcp_mtu_probing = 1

# -------------------------------------------------------------------
# 3. Puffergrößen & Backlog-Limits (High Throughput / Low Latency)
# -------------------------------------------------------------------
# Maximale Listen-Backlog-Warteschlange für Server-Sockets
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Maximale Anzahl an Paketen in der Netzwerkkarten-Eingangswarteschlange
net.core.netdev_max_backlog = 16384

# Maximale Sende- und Empfangspuffer (16 MB)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# TCP Autotuning Puffer (Min / Standard / Max in Bytes)
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
