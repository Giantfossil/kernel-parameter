# /etc/sysctl.d/30-memory.conf
# Speicherverwaltung, Swap-Verhalten und Virtueller Speicher (VM-Tuning)

# -------------------------------------------------------------------
# 1. Swappiness & Cache-Druck
# -------------------------------------------------------------------
# Bevorzugt RAM gegenüber Swap. Optimal für Desktop/Workstation.
# 180 erlaubt aggressives Nutzen von zRAM (zstd-Komprimierung im RAM).
# Schont die Festplatte und vergrößert effektiven RAM auf ~45-50 GB.
vm.swappiness = 180

# Behält Filesystem-Caches (Dentries & Inodes) länger im RAM. 
# Beschleunigt 'git status', Dateisuchen & Entwicklungsumgebungen.
vm.vfs_cache_pressure = 50

# -------------------------------------------------------------------
# 2. Writeback-Verhalten (Dirty Memory Flushing)
# -------------------------------------------------------------------
# Hintergrund-Writeback starten, sobald 5% des RAMs (~1,6GB) schmutzige Daten enthalten.
vm.dirty_background_ratio = 5

# Blockierendes Writeback erzwingen bei 10% (~3,2GB) 
# schmutzigem Speicher (verhindert I/O-Stalls bei NVMe/SSD).
vm.dirty_ratio = 10

# -------------------------------------------------------------------
# 3. Speicherzuweisungen & Limits (Gaming, Docker, Wasm)
# -------------------------------------------------------------------
# Maximale Anzahl an Virtual Memory Mappings (mmap) stark erhöhen.
# Essenziell für modernste Spiele (Proton/Steam), Docker-Container & Datenbanken.
vm.max_map_count = 1048576

# Standard Overcommit-Verhalten beibehalten
vm.overcommit_memory = 0

# Proaktive Speicherkompaktierung zur Reduzierung von Fragmentierung
vm.compaction_proactiveness = 20

# Swap Page Cluster Tuning (Liest 1 Page [4KB] einzeln bei ZRAM oder schnellen SSDs)
#Verhindert unnötige CPU-Dekompression.
vm.page-cluster = 0
