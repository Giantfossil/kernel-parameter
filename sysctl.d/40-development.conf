# /etc/sysctl.d/40-development.conf
# Entwicklungs-Tools, File-Watcher, Async-I/O und Systemlimits

# -------------------------------------------------------------------
# 1. Inotify Limits (Dateisystem-Überwachung)
# -------------------------------------------------------------------
# Maximale Anzahl an überwachten Dateien/Verzeichnissen pro Benutzer (IDEs, VS Code, Vite, Node).
fs.inotify.max_user_watches = 524288

# Maximale Anzahl an inotify-Instanzen pro Benutzer (Docker, Sync-Dienste, IDEs).
fs.inotify.max_user_instances = 1024

# Maximale Anzahl ausstehender Event-Warteschlangen für inotify.
# Verdoppelt die Puffergröße für Dateisystem-Events. 
# Sehr gut bei riesigen Ordnerstrukturen oder vielen aktiven Container-Mounts.
fs.inotify.max_queued_events = 32768

# -------------------------------------------------------------------
# 2. Dateideskriptoren & Async I/O Limits
# -------------------------------------------------------------------
# Maximale Anzahl an gleichzeitig geöffneten Dateien im gesamten Kernel.
# Hinweis: fs.file-max weggelassen, da 64-Bit-Kernels standardmäßig
# bereits ein dynamisches/unbegrenztes Limit (LONG_MAX) nutzen.
#fs.file-max = 2097152

# Maximale Anzahl an parallelen Asynchronen I/O-Operationen (PostgreSQL, QEMU/KVM).
fs.aio-max-nr = 1048576

# Maximale PID-Anzahl erhöhen (Verhindert PID-Erschöpfung in parallelen Dev-Containern)
kernel.pid_max = 4194304

# -------------------------------------------------------------------
# 3. Debugging & Profiling für Entwickler
# -------------------------------------------------------------------
# Restriktives Ptrace (Erlaubt Debugging [gdb, lldb, valgrind, strace] eigener Kindprozesse ohne Root).
kernel.yama.ptrace_scope = 1

# Erlaubt unprivilegierten Benutzern Profiling mit 'perf'.
kernel.perf_event_paranoid = 2
