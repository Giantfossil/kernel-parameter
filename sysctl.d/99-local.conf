# /etc/sysctl.d/99-local.conf
# Lokale, hostspezifische Überschreibungen und benutzerspezifische Anpassungen
#
# Hinweis: Dateinamen in /etc/sysctl.d/ werden in alphanumerischer Reihenfolge verarbeitet.
# Einstellungen in dieser Datei (99-local.conf) überschreiben vorherige Werte.

# -------------------------------------------------------------------
# Beispiel-Überschreibungen (Einkommentieren bei Bedarf)
# -------------------------------------------------------------------

# IP-Weiterleitung aktivieren (Nötig für VPN-Gateways oder KVM/Docker-Netzwerke)
net.ipv4.ip_forward = 1
# net.ipv6.conf.all.forwarding = 1

# IPv6 vollständig deaktivieren (falls im lokalen Netzwerk kein IPv6 genutzt wird)
# kann bei Spotify, Podman, Docker, Resolver etc zu Probleme führen
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1
